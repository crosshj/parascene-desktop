[package]
name = "parascene-desktop"
version = "1.1.20"
description = "Parascene Desktop"
authors = ["Parascene"]
edition = "2021"

[lib]
name = "parascene_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
http-range = "0.1"
percent-encoding = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
rustfft = "6"
rfd = "0.15"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
wgpu = "30"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
arboard = "3"

# Force gpu-allocator onto the same windows version as wgpu-hal (0.62).
# Without this, Cargo can resolve gpu-allocator to windows 0.61 while wgpu-hal
# uses 0.62, which breaks the Windows D3D12 build with ID3D12Device type mismatches.
[target.'cfg(windows)'.dependencies]
windows = "0.62"
