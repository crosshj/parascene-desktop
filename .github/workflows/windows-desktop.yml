name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "desktop-v*"
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build desktop (x64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required to build updater artifacts."
            echo "Generate with: npx tauri signer generate -w .tauri-signing/updater.key --password '' --ci"
            echo "Then: gh secret set TAURI_SIGNING_PRIVATE_KEY < .tauri-signing/updater.key"
            exit 1
          fi
          npm run build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: parascene-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

      # Rolling prerelease on main — always downloadable from the Releases page
      - name: Publish continuous prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: desktop-latest
          name: Desktop — latest main
          prerelease: true
          make_latest: false
          body: |
            Unsigned desktop builds from `main` (updated on each qualifying push).

            ### macOS (Apple Silicon)
            Open the DMG → drag to Applications, then:
            ```bash
            xattr -cr /Applications/Parascene.app
            ```

            ### Windows (x64)
            Run the NSIS installer (`.exe`). SmartScreen may warn on unsigned builds — choose **More info** → **Run anyway**.
            WebView2 is installed automatically if missing.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updater manifest (desktop-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="$(bash scripts/app-version.sh)"
          python3 scripts/publish-updater-manifest.py desktop-latest "$VERSION" "Continuous build from main"

      # Versioned release when tagging desktop-v*
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2.2.1
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updater manifest (versioned)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="$(bash scripts/app-version.sh)"
          python3 scripts/publish-updater-manifest.py "${GITHUB_REF_NAME}" "$VERSION"
