name: macOS desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "desktop-v*"
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/macos-desktop.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/macos-desktop.yml"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build desktop (aarch64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is required to build updater artifacts."
            echo "Generate with: npx tauri signer generate -w .tauri-signing/updater.key --password '' --ci"
            echo "Then: gh secret set TAURI_SIGNING_PRIVATE_KEY < .tauri-signing/updater.key"
            exit 1
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run build

      - name: Clean DMG volume icons
        run: bash scripts/clean-dmg.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: parascene-macos-aarch64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

      # Rolling prerelease on main — always downloadable from the Releases page
      - name: Publish continuous prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: desktop-latest
          name: Desktop — latest main
          prerelease: true
          make_latest: false
          body: |
            Unsigned desktop builds from `main` (updated on each qualifying push).

            ### macOS (Apple Silicon)
            Open the DMG → drag to Applications, then:
            ```bash
            xattr -cr "/Applications/Parascene Desktop.app"
            ```

            ### Windows (x64)
            Run the NSIS installer (`.exe`). SmartScreen may warn on unsigned builds — choose **More info** → **Run anyway**.
            WebView2 is installed automatically if missing.
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updater manifest (desktop-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$(bash scripts/app-version.sh)"
          python3 scripts/publish-updater-manifest.py desktop-latest "$VERSION" "Continuous build from main"

      # Versioned release when tagging desktop-v*
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updater manifest (versioned)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$(bash scripts/app-version.sh)"
          python3 scripts/publish-updater-manifest.py "${GITHUB_REF_NAME}" "$VERSION"
